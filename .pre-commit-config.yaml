default_language_version:
    python: python3.14

default_stages: [pre-commit, pre-push]

exclude: library_install_tests/


repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: debug-statements
- repo: https://github.com/astral-sh/ty-pre-commit
  # ty version.
  rev: v0.0.65
  hooks:
    - id: ty
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.0
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format

- repo: local
  hooks:
    - id: update_packages
      name: update_packages
      entry: uv lock --upgrade
      language: python
      pass_filenames: false
    - id: doctests
      name: doctests (top-level *.py)
      entry: uv run python pre_commit_hooks/run_doctests.py
      language: system
      pass_filenames: false
      always_run: true
